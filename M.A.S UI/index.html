<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0f8cff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="samm" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>samm | Marketing workflow and approvals</title>
    <link rel="icon" type="image/png" href="/samm-app-icon.png?v=20260423" />
    <link rel="apple-touch-icon" href="/samm-app-icon.png?v=20260423" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        const isLocalDev =
          ["localhost", "127.0.0.1", "0.0.0.0"].includes(window.location.hostname) ||
          window.location.hostname.startsWith("192.168.") ||
          window.location.port.startsWith("517");

        if (!isLocalDev) {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("/sw.js").catch(() => {});
          });
        }
      }
    </script>
  </body>
</html>
